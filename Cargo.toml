[package]
name = "audiohub"
version = "0.1.1"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
